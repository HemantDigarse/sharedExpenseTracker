services:
  - type: web
    name: shared-expense-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shared-expense-db
          property: connectionString
      - key: DATABASE_HOST
        fromDatabase:
          name: shared-expense-db
          property: host
      - key: DATABASE_NAME
        fromDatabase:
          name: shared-expense-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: shared-expense-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: shared-expense-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: USD_TO_INR_RATE
        value: 83.00
      - key: SPRING_DOCKER_COMPOSE_ENABLED
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://shared-expense-frontend.onrender.com,https://*.onrender.com

  - type: web
    name: shared-expense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://shared-expense-backend-3viq.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: shared-expense-db
    plan: free
    databaseName: expense_tracker
    user: expense_user
