services:
  - type: web
    name: shared-expense-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shared-expense-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: USD_TO_INR_RATE
        value: 83.00
      - key: SPRING_DOCKER_COMPOSE_ENABLED
        value: false

  - type: web
    name: shared-expense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://shared-expense-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: shared-expense-db
    plan: free
    databaseName: expense_tracker
    user: expense_user
