# ==============================================================
# Shared Expense Tracker — Application Configuration
# ==============================================================
# This file configures Spring Boot, JPA/Hibernate, Flyway, and
# JWT settings. All sensitive values are injected via environment
# variables (see .env.example for the full list).
# ==============================================================

# ---------------------------------------------------------------
# APPLICATION
# ---------------------------------------------------------------
spring.application.name=shared-expense-tracker
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------
# DATABASE (PostgreSQL)
# ---------------------------------------------------------------
# Connection URL, username, and password are injected from env vars.
# Defaults point to a local Docker PostgreSQL instance.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DATABASE_USERNAME:expense_user}
spring.datasource.password=${DATABASE_PASSWORD:expense_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------
# LOCAL DOCKER COMPOSE
# ---------------------------------------------------------------
# Enables direct `mvn spring-boot:run` from backend/ to start the
# local PostgreSQL service declared in backend/compose.yaml.
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start_only

# ---------------------------------------------------------------
# JPA / HIBERNATE
# ---------------------------------------------------------------
# CRITICAL: We use 'validate' mode — Hibernate only checks that
# entities match the DB schema. Flyway manages all DDL.
# Using 'create' or 'update' would bypass our migration strategy.
# See DECISIONS.md: "Flyway vs Liquibase" for rationale.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------
# FLYWAY (Database Migrations)
# ---------------------------------------------------------------
# Flyway runs migration files from db/migration/ on startup.
# Each file is versioned (V1__, V2__, ...) and applied in order.
# Once applied, a migration is never re-run — Flyway tracks state
# in the 'flyway_schema_history' table.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------
# JWT CONFIGURATION
# ---------------------------------------------------------------
# Secret key for signing JWT tokens (HS256 algorithm).
# MUST be at least 256 bits (32 characters) for security.
# In production, this MUST be set via environment variable.
jwt.secret=${JWT_SECRET:default-dev-secret-key-change-in-production-must-be-at-least-32-chars}
# Token validity period in milliseconds (24 hours = 86400000ms)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------------------------------------------------------------
# CURRENCY CONFIGURATION
# ---------------------------------------------------------------
# Static USD to INR conversion rate.
# DECISION: We use a static rate (documented in DECISIONS.md)
# because the assignment data is historical (Feb-May timeframe)
# and consistency matters more than real-time accuracy for 
# retroactive expense reconciliation.
currency.usd-to-inr-rate=${USD_TO_INR_RATE:83.00}

# ---------------------------------------------------------------
# FILE UPLOAD
# ---------------------------------------------------------------
# Maximum CSV file size for import (10MB should cover any
# reasonable expense spreadsheet).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------
logging.level.com.spreetail.expenses=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
